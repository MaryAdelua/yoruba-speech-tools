name: Publish frozen Condition B container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - execution/condition_b/Dockerfile
      - execution/condition_b/requirements.lock.txt
      - .github/workflows/publish-condition-b-container.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: execution/condition_b/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yoruba-speech-tools-condition-b:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/yoruba-speech-tools-condition-b:protocol-v1
      - name: Record immutable reference
        run: |
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/yoruba-speech-tools-condition-b@${{ steps.build.outputs.digest }}" | tee condition-b-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: condition-b-image-reference
          path: condition-b-image.txt
